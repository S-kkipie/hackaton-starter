name: ci
on:
    push:
        branches: [main]
    pull_request:
permissions:
    contents: read
jobs:
    check:
        runs-on: ubuntu-latest
        env:
            SKIP_ENV_VALIDATION: "1"
            # Not a secret: only keeps Better Auth from warning about its default during the build.
            BETTER_AUTH_SECRET: ci-build-only-not-a-real-secret-0000000000
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm build
